name: Sequential page timing check
on:
  workflow_dispatch:
    inputs:
      homepage:
        description: Public HTTPS homepage
        required: true
        type: string
      feed:
        description: Public HTTPS RSS feed on the same origin
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sequential-page-timing-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare normal browser
        run: |
          node --version
          probe_chrome="$(command -v google-chrome)"
          "$probe_chrome" --version
          printf 'CHROME_BIN=%s\n' "$probe_chrome" >> "$GITHUB_ENV"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Compare direct RSS with homepage then ten-second pause
        env:
          HOME_URL: ${{ inputs.homepage }}
          FEED_URL: ${{ inputs.feed }}
        run: xvfb-run -a node timing-probe.mjs
