name: Sequential page timing check
on:
  workflow_dispatch:
    inputs:
      homepage:
        description: Public HTTPS homepage
        required: true
        type: string
      feed:
        description: Public HTTPS RSS feed on the same origin
        required: true
        type: string
      warm_session:
        description: Open the RSS first and retain its ordinary session cookies
        type: boolean
        default: false
      engine:
        description: Normal browser engine to test
        type: choice
        default: chromium
        options: [chromium, firefox, webkit]
      rounds:
        description: Number of reads with the same browser session
        type: choice
        default: "2"
        options: ["2", "4"]
      runner:
        description: Standard public runner
        type: choice
        default: ubuntu-24.04
        options: [ubuntu-24.04, macos-15]
permissions:
  contents: read
concurrency:
  group: sequential-page-timing-check-${{ inputs.engine || 'chromium' }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare normal browser
        env:
          PROBE_ENGINE: ${{ inputs.engine || 'chromium' }}
        run: |
          node --version
          npm ci --ignore-scripts --no-audit --no-fund
          if [ "$PROBE_ENGINE" = "chromium" ]; then
            probe_chrome="$(command -v google-chrome)"
            "$probe_chrome" --version
            printf 'CHROME_BIN=%s\n' "$probe_chrome" >> "$GITHUB_ENV"
          else
            npx playwright-core install --with-deps "$PROBE_ENGINE"
          fi
      - name: Compare direct RSS with homepage then ten-second pause
        env:
          HOME_URL: ${{ inputs.homepage }}
          FEED_URL: ${{ inputs.feed }}
          WARM_SESSION_WITH_FEED: ${{ inputs.warm_session && '1' || '0' }}
          ROUNDS: ${{ inputs.rounds || '2' }}
          PROBE_ENGINE: ${{ inputs.engine || 'chromium' }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a node timing-probe.mjs
          else
            node timing-probe.mjs
          fi
